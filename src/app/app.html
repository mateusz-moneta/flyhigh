<div class="app">
  <div class="app__header">
    <p-button (click)="addDialogVisible.set(true)" label="Dodaj" />
  </div>

  <div class="app__content">
    <div class="app__table">
      <p-table [value]="companies()">
        <ng-template #header>
          <tr>
            <th>Nazwa firm</th>
            <th>Ilość akcji</th>
            <th>Wartość brutto</th>
            <th>Wartość NETTO</th>
          </tr>
        </ng-template>

        <ng-template #body let-company>
          <tr>
            <td>{{ company.name }}</td>
            <td>{{ company.shares }}</td>
            <td>{{ company.price_gross }}</td>
            <td>{{ company.price_net }}</td>
          </tr>
        </ng-template>
      </p-table>
    </div>

    <div class="app__graph">
      @if (companies(); as companies) {
        <app-chart [companies]="companies" />
      }
    </div>
  </div>
</div>

<app-add-dialog
  [visible]="addDialogVisible()"
  (hide)="addDialogVisible.set(false)"
  (save)="onSave($event)"
/>
